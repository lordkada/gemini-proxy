name: gemini-proxy

services:
  # Chromium with a web UI (KasmVNC) at http://localhost:3000.
  # You sign in to Gemini here once; the profile volume keeps the session.
  browser:
    image: lscr.io/linuxserver/chromium:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - CHROME_CLI=--remote-debugging-port=9222 https://gemini.google.com/app
    volumes:
      - profile:/config
    ports:
      - "127.0.0.1:${BROWSER_PORT:-3000}:3000"
    shm_size: "1gb"
    restart: unless-stopped

  # Shares the browser's network namespace so it can reach the DevTools port
  # (bound to 127.0.0.1 inside the browser container). Periodically reloads
  # Gemini and exports cookies + page tokens to the shared session volume.
  session-sync:
    build: ./session-sync
    network_mode: "service:browser"
    depends_on: [browser]
    environment:
      - SYNC_INTERVAL_SEC=${SYNC_INTERVAL_SEC:-600}
      - GEMINI_AUTH_USER=${GEMINI_AUTH_USER:-}
    volumes:
      - session:/session
    restart: unless-stopped

  # OpenAI- and Gemini-compatible API on http://localhost:8081.
  proxy:
    build: ./proxy
    depends_on: [session-sync]
    environment:
      - PROXY_API_KEY=${PROXY_API_KEY:?Set PROXY_API_KEY in .env (see .env.example)}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-3.6-flash}
      - TEMPORARY_CHATS=${TEMPORARY_CHATS:-true}
      - TOOL_REMINDER=${TOOL_REMINDER:-true}
    volumes:
      - session:/session:ro
    ports:
      - "127.0.0.1:${PROXY_PORT:-8081}:8081"
    restart: unless-stopped

volumes:
  profile:
  session:
